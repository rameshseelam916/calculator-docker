
name: CI - Build and Test

on:
  pull_request:
    branches: [dav]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
        env:
          CI: true

      - name: Build the React app
        run: npm run build
        env:
          PUBLIC_URL: /

      - name: Build Docker image
        run: docker build -t calculator-app:pr-${{ github.event.pull_request.number }} .
